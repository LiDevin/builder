caseStudies:
  - title: "DSP Management"
    problem: >
      A British Council campaign was under-pacing at its existing bid — holding the same brand
      exposure would need more budget.
    approach: >
      Investigated the cause: the 11.11 e-commerce festival was drawing aggressive retail
      advertisers into a similar audience pool, driving up competition. Recommended shifting
      budget toward retargeting for the festival period instead of raising bids.
    outcome: >
      Held brand exposure at lower cost and exceeded the year-end online conversion target.

  - title: "Performance Advisory"
    problem: >
      Blue Insurance wanted more completed online quotations, but cost per acquisition (CPA) was
      too high.
    approach: >
      Added floodlight tracking to each step of the quotation flow, then retargeted users with a
      different bidding strategy based on where they dropped off.
    outcome: >
      More precise bidding and a lower CPA.

  - title: "Automated Reporting"
    problem: >
      Multi-market campaign data was fragmented across APAC and North America, requiring manual
      workflows to piece together insights.
    approach: >
      Centralized the data using BigQuery and Data Studio, building automated dashboards to
      replace the manual process.
    outcome: >
      Cut report turnaround from about a week to one day.
