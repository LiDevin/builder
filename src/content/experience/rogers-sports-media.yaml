company: "Rogers Sports & Media"
title: "Ad Tech and Product Specialist"
dateRange: "Apr 2023 – Present"
location: "Toronto, Ontario, Canada"
keyProducts:
  - Sportsnet
  - CityNews
  - SeekYourSounds.com

overview: >
  Programmatic ad tech specialist managing ad infrastructure across all of Rogers' digital
  properties, with Sportsnet, CityNews, and SeekYourSounds.com requiring the most maintenance.
  Works with developers and external vendors to build, test, and launch ad products, and
  investigates ad delivery issues across the inventory backend.

stack:
  - Google Ad Manager (GAM)
  - Magnite
  - SSP/DSP integrations
  - VAST/VMAP
  - Charles Proxy
  - Chrome DevTools
  - BigQuery
  - JavaScript
  - Rich media ad formats
  - Git
  - ads.txt / sellers.json
  - REST API testing
  - Yield optimization
  - LiveIntent
  - AMP for Email

caseStudies:
  - title: "Programmatic Integrations"
    teaser: "Onboarded new video partners and built VAST tags for emerging ad formats."
    problem: >
      New video ad partners and formats (Google Web Stories, vertical video for sports
      highlights) needed VAST tags to work with Sportsnet's existing player.
    approach: >
      Built and provided VAST tags for partner onboarding (e.g. Slimcut) and for new formats,
      including Google Web Stories and vertical video.
    outcome: >
      Both launched successfully and went live in production.

  - title: "Technical Troubleshooting"
    teaser: "Traced a sitewide impressions drop to a systemic bug and built lasting safeguards."
    problem: >
      Impressions dropped sharply on Sportsnet. One section's sponsorship takeover had stopped
      working.
    approach: >
      Traced the ad request and found the section wasn't sending the correct ad unit path (IU),
      so the sponsorship line item had nothing to respond to. Root cause: the value was dropped
      whenever a large update went to production.
    outcome: >
      Fixed the issue, then built two safeguards: a scheduled check that verifies the ad unit
      path, and a manual override to fix it immediately if it recurs.
    details:
      - "A similar issue: Sportsnet's redesign from infinite scroll to a single-article layout broke the Slimcut video player."
      - "Fixed by updating the ad rule JS so the player inserted correctly in the new layout."
      - "Also uses the command line (ls, cd, mkdir) to run a developer-built function that manually refreshes site cache when needed."

  - title: "Live Video Ad Troubleshooting"
    teaser: "Used Chrome DevTools to fix missing pre-roll ads on Sportsnet's LiveTracker."
    problem: >
      Pre-roll video ads were missing from Sportsnet's LiveTracker, which uses client-side ad
      insertion (CSAI).
    approach: >
      Used Chrome DevTools to inspect the ad request and found the ad unit path was undefined,
      and the wrong video ID was sometimes pulled from Brightcove. Flagged the fix to the
      developer.
    outcome: >
      Pre-roll ads resumed serving normally; monitored impressions for a week to confirm the fix
      held.

  - title: "Workflow Automation"
    teaser: "Replaced manual, sample-only ad checks with full automated coverage across 200+ sites."
    problem: >
      Checking ad delivery across 200+ properties was manual: visiting each site, scrolling to
      trigger every ad request, and inspecting them one by one. Full coverage wasn't practical,
      so the team could only sample-check.
    approach: >
      Built a Python script using Selenium to drive a real browser per site, capture ad requests
      from the network tab, and export them to Excel for the team to check. Runs whenever a
      radio site update ships.
    outcome: >
      Replaced sample-only checks with full coverage across all 200+ properties on every run.

  - title: "Rich Media Ad Templates"
    teaser: "Built the JavaScript template powering sponsorship and rich media placements sitewide."
    problem: >
      Sponsorship and rich media placements (badges, wallpaper units, homepage takeovers) needed
      to work across many different page layouts — a single static creative didn't render
      correctly everywhere.
    approach: >
      Built and maintain the JavaScript creative template that runs inside the ad iframe: it
      edits the host page's DOM directly — toggling elements between display: none and block,
      injecting the sponsorship image and text — branching per placement to fit each layout.
    outcome: >
      Covers Sportsnet, CityNews, and SeekYourSounds.com, and gets extended with every site
      redesign that introduces a new layout.
    details:
      - "A new layout isn't a rewrite — it's a new branch of logic added to the existing template."

  - title: "Supply Chain File Management"
    teaser: "Manages ads.txt/sellers.json for Rogers and partner publishers via a git-based workflow."
    problem: >
      Rogers' own ads.txt/sellers.json (hosted on Akamai) and partner publishers' ads.txt files
      needed to stay accurate as inventory relationships changed — errors here can break
      programmatic monetization for the affected inventory.
    approach: >
      For Rogers' own files, used an internal developer-built tool to push updates to Akamai. For
      partner publishers, managed the files through an internal git-backed tool: committed changes
      via VS Code's Git integration and merged to the main branch, which published an updated
      summary site to share directly with each partner.
    outcome: >
      Kept supply chain declarations accurate for Rogers' own inventory and multiple partner
      publishers, using a real git-based publishing workflow.

  - title: "API Testing for Product QA"
    teaser: "Wrote a JS script that verifies a core product API before every production launch."
    problem: >
      Before launching a new version of an internal ad product, its API bridge to WordPress — a
      fundamental function — needed to be verified working correctly.
    approach: >
      Wrote a JavaScript script that calls the endpoint with the proper credentials and checks
      that the correct JSON information is returned for each site's configuration.
    outcome: >
      Runs routinely as part of the QA process before every new version launches to production.

  - title: "Yield Optimization for New Inventory"
    teaser: "Diagnosed a new partner's low fill rate and fixed it through price floor and pricing rule changes."
    problem: >
      A newly onboarded French partner's inventory had a low fill rate on GAM.
    approach: >
      Investigated the cause: AdX buyers target campaigns based on an inventory's historical
      performance, and new inventory typically takes up to 4 weeks to stabilize. The bid range
      report showed most bids were being rejected, so lowered the price floor to match actual
      demand. Also found the pricing rule was set to "Optimized" — which sets floors from 2 years
      of historical seasonal data, poorly suited to brand-new inventory — and switched it to "Set
      Target CPM," which dynamically adjusts the floor on matching inventory to maximize fill
      rate.
    outcome: >
      After a few weeks, fill rate stabilized and CPM improved.

  - title: "Newsletter Ad Delivery Troubleshooting"
    teaser: "Traced broken newsletter ad images to an outdated CNAME and fixed it with a DNS and AMP script update."
    problem: >
      Ads were showing broken images in newsletters served through LiveIntent.
    approach: >
      Worked with LiveIntent's account manager to trace the cause to an outdated CNAME record.
      Had the networking team update the CNAME, then updated the AMP script on the newsletter to
      point to the new location — the CNAME fix alone wasn't enough.
    outcome: >
      Broken images resolved.
