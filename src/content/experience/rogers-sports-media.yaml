overview: >
  Programmatic ad tech specialist managing omnichannel ad infrastructure across Sportsnet, CityNews,
  and CityTV. Works closely with developers and external vendors to create, test, and launch ad
  products, and leads deep-dive investigations into ad delivery issues across the inventory backend.

stack:
  - Google Ad Manager (GAM)
  - Magnite
  - SSP/DSP integrations
  - VAST/VMAP
  - Charles Proxy
  - Chrome DevTools
  - BigQuery
  - JavaScript
  - Rich media ad formats

caseStudies:
  - title: "Programmatic Integrations"
    problem: >
      New video ad partners and new ad formats (Google Web Stories, vertical video for sports
      highlights) needed to be onboarded onto Sportsnet's video infrastructure, each requiring a
      correctly-configured VAST tag to work with the existing player setup.
    approach: >
      Built and provided VAST tags for new partner onboarding (e.g. Slimcut, Sportsnet's video
      vendor), and created new VAST tags to support emerging formats including Google Web Stories
      and vertical video for sports highlights.
    outcome: >
      Both the new partner integration and the new ad formats (Google Web Stories, vertical
      video) launched successfully and went live in production. Monetization/revenue performance
      of these formats sits with a different team and wasn't part of this work.

  - title: "Technical Troubleshooting"
    problem: >
      Impressions dropped significantly site-wide on Sportsnet. Investigating section by section,
      one specific section had a severe drop — its sponsorship takeover placement had stopped
      working.
    approach: >
      Traced the issue through the ad request and found the section wasn't fetching/sending the
      correct ad unit path (IU) value, so the sponsorship line item had nothing to respond to.
      Working with a developer, found the root cause: the system was omitting this value whenever
      a large update was pushed to production.
    outcome: >
      Fixed the immediate issue, then built two lasting safeguards: a scheduled automated check
      that verifies the ad unit path stays correct on the site, and a manual override tool so the
      value could be corrected immediately if the issue recurred.
    details: >
      Similar debugging elsewhere: when Sportsnet's article pages switched from an infinite-scroll
      layout to a single-article page design, the Slimcut video player (inserted every few
      paragraphs) stopped working. Updated the ad rule JS on the backend so the player inserted
      correctly and fit the new layout.

  - title: "Live Video Ad Troubleshooting"
    problem: >
      Pre-roll video ads were missing from Sportsnet's LiveTracker product, which uses client-side
      ad insertion (CSAI).
    approach: >
      Used Chrome DevTools to inspect the ad request in the browser and found two issues: the ad
      unit path was coming through undefined, and in some cases the wrong video ID was being
      pulled from Brightcove (the video platform). Flagged the correct values to the developer to
      fix.
    outcome: >
      Pre-roll ads resumed serving normally on LiveTracker. Reported by the LiveTracker product
      manager rather than caught through internal monitoring; resolved as a one-off fix, and
      monitored impression numbers for the following week to confirm the fix held.

  - title: "Workflow Automation"
    problem: >
      Checking ad delivery across 200+ digital properties was entirely manual: visiting each site,
      scrolling to the bottom to trigger every ad request, and inspecting each request one by one.
      Covering all 200+ properties this way wasn't practical, so the team could only spot-check a
      sample.
    approach: >
      Built a Python script using Selenium for browser automation — it drives a real browser to
      visit each site (loading ads the same way a person would), captures every ad request from
      the network tab, and exports it all to Excel, where the team checks it with simple formulas.
      Runs whenever there's an update to the radio sites, since changes are typically applied
      across all of them at once.
    outcome: >
      Replaced manual, sample-only spot checks with full coverage across all 200+ properties every
      time the script runs — something that wasn't practically possible by hand. Used by the ad
      tech team internally.

  - title: "Rich Media Ad Templates"
    problem: >
      Sponsorship and rich media placements (badges, wallpaper units, homepage takeovers) needed
      to work across many different page sections on Rogers' properties, each with its own layout
      — a single static creative wouldn't render correctly everywhere it needed to run.
    approach: >
      Built and maintained the JavaScript creative template that runs inside the ad iframe: it
      amends the host page's DOM directly — toggling elements between display: none and block,
      injecting the sponsorship image and text — branching its logic per placement to handle each
      section's distinct structure.
