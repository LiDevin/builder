  - title: "Technical Troubleshooting"
    problem: >
      Impressions dropped significantly site-wide on Sportsnet. Investigating section by section,
      one specific section had a severe drop — its sponsorship takeover placement had stopped
      working.
    approach: >
      Traced the issue through the ad request and found the section wasn't fetching/sending the
      correct ad unit path (IU) value, so the sponsorship line item had nothing to respond to.
      Working with a developer, found the root cause: the system was omitting this value whenever
      a large update was pushed to production.
    outcome: >
      Fixed the immediate issue, then built two lasting safeguards: a scheduled automated check
      that verifies the ad unit path stays correct on the site, and a manual override tool so the
      value could be corrected immediately if the issue recurred.
    details: >
      Similar debugging elsewhere: when Sportsnet's article pages switched from an infinite-scroll
      layout to a single-article page design, the Slimcut video player (inserted every few
      paragraphs) stopped working. Updated the ad rule JS on the backend so the player inserted
      correctly and fit the new layout.

  - title: "Live Video Ad Troubleshooting"
    problem: >
      Pre-roll video ads were missing from Sportsnet's LiveTracker product, which uses client-side
      ad insertion (CSAI).
    approach: >
      Used Chrome DevTools to inspect the ad request in the browser and found two issues: the ad
      unit path was coming through undefined, and in some cases the wrong video ID was being
      pulled from Brightcove (the video platform). Flagged the correct values to the developer to
      fix.
    outcome: >
      Pre-roll ads resumed serving normally on LiveTracker. TODO — add a specific metric once
      available (e.g. how long the issue had been live, or estimated impressions/revenue
      recovered).
    details: >
