  - title: "Rich Media Ad Templates"
    problem: >
      Sponsorship and rich media placements (badges, wallpaper units, homepage takeovers) needed
      to work across many different page sections on Rogers' properties, each with its own layout
      — a single static creative wouldn't render correctly everywhere it needed to run.
    approach: >
      Built and maintained the JavaScript creative template that runs inside the ad iframe: it
      amends the host page's DOM directly — toggling elements between display: none and block,
      injecting the sponsorship image and text — branching its logic per placement to handle each
      section's distinct structure.
